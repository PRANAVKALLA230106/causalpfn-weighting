[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cfm"
version = "1.0.0"
description = "What estimator does CausalPFN learn? Exact weighting decomposition, probes and erasure for a causal foundation model."
authors = [{ name = "Pranav Kalla" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy",
  "pandas",
  "scikit-learn",
  "joblib",
  "matplotlib",
  "huggingface_hub",
]

[tool.setuptools]
packages = ["cfm"]
